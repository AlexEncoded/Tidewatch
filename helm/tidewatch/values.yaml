replicaCount: 1

api:
  image:
    repository: tidewatch/api
    tag: dev
    pullPolicy: IfNotPresent
  port: 8000
  waveImuHeightFactor: 0.1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

workloadIdentity:
  enabled: false
  serviceAccountName: tidewatch-api
  clientId: ""

worker:
  image:
    repository: tidewatch/worker
    tag: dev
    pullPolicy: IfNotPresent
  intervalSeconds: 10
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

frontend:
  image:
    repository: tidewatch/frontend
    tag: dev
    pullPolicy: IfNotPresent
  port: 8080
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

database:
  existingSecret: tidewatch-database
  existingSecretKey: DATABASE_URL

keyVault:
  enabled: false
  name: ""
  tenantId: ""
  databaseSecretName: database-url

service:
  type: ClusterIP

ingress:
  enabled: false
  className: nginx
  host: tidewatch.local
  annotations: {}
  tls: []

nameOverride: ""
fullnameOverride: ""
