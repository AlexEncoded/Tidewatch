apiVersion: v1
kind: Service
metadata:
  name: {{ include "tidewatch.fullname" . }}-frontend
  labels:
    {{- include "tidewatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: {{ include "tidewatch.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
