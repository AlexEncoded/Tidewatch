{{- if or .Values.workloadIdentity.enabled .Values.keyVault.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.workloadIdentity.serviceAccountName }}
  labels:
    {{- include "tidewatch.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId is required when workload identity is enabled" .Values.workloadIdentity.clientId | quote }}
{{- end }}
