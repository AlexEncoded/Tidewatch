{{- if .Values.keyVault.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "tidewatch.fullname" . }}-api-secrets
  labels:
    {{- include "tidewatch.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ .Values.database.existingSecret }}
      type: Opaque
      data:
        - objectName: {{ .Values.keyVault.databaseSecretName | quote }}
          key: {{ .Values.database.existingSecretKey | quote }}
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "workloadIdentity.clientId is required when Key Vault is enabled" .Values.workloadIdentity.clientId | quote }}
    keyvaultName: {{ required "keyVault.name is required when Key Vault is enabled" .Values.keyVault.name | quote }}
    tenantId: {{ required "keyVault.tenantId is required when Key Vault is enabled" .Values.keyVault.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: {{ .Values.keyVault.databaseSecretName }}
          objectType: secret
{{- end }}
