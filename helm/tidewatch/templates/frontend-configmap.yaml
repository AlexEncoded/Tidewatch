apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tidewatch.fullname" . }}-frontend-nginx
  labels:
    {{- include "tidewatch.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location /api/ {
        proxy_pass http://{{ include "tidewatch.fullname" . }}-api:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
