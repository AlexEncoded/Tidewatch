replicaCount: 1

api:
  image:
    repository: tidewatch/api
    tag: dev
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi

worker:
  image:
    repository: tidewatch/worker
    tag: dev
  intervalSeconds: 15

frontend:
  image:
    repository: tidewatch/frontend
    tag: dev

service:
  type: ClusterIP

ingress:
  enabled: false
