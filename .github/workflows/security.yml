name: Tidewatch security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  filesystem:
    name: Scan repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  containers:
    name: Scan container images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --tag tidewatch-api:security apps/api

      - name: Build worker image
        run: docker build --tag tidewatch-worker:security apps/worker

      - name: Scan API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tidewatch-api:security
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Scan worker image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tidewatch-worker:security
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
