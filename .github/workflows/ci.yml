name: Tidewatch CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://tidewatch:tidewatch@localhost:5432/tidewatch
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tidewatch
          POSTGRES_USER: tidewatch
          POSTGRES_PASSWORD: tidewatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tidewatch -d tidewatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app tests alembic

      - name: Wait for database
        run: |
          for attempt in {1..30}; do
            pg_isready -h localhost -p 5432 -U tidewatch -d tidewatch && exit 0
            sleep 1
          done
          exit 1

      - name: Apply database migrations
        run: |
          for attempt in {1..3}; do
            alembic upgrade head && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "Migration attempt $attempt failed; retrying..."
              sleep 2
            fi
          done
          exit 1

      - name: Run tests
        run: pytest

  container-build:
    name: Container builds
    runs-on: ubuntu-latest
    needs: api-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --tag tidewatch-api:ci apps/api

      - name: Build worker image
        run: docker build --tag tidewatch-worker:ci apps/worker

      - name: Build frontend image
        run: docker build --tag tidewatch-frontend:ci apps/frontend

  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest==8.3.4

      - name: Run worker tests
        run: pytest

  observability-rules:
    name: Observability rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Grafana dashboards
        run: python -m json.tool observability/grafana/dashboards/tidewatch-overview.json > /dev/null

      - name: Validate Prometheus rules
        run: >-
          docker run --rm --entrypoint promtool
          -v "${{ github.workspace }}:/work:ro"
          prom/prometheus:v2.55.1
          check rules /work/observability/alerts/tidewatch.rules.yml
