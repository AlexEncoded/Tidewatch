name: Tidewatch CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://tidewatch:tidewatch@localhost:5432/tidewatch
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tidewatch
          POSTGRES_USER: tidewatch
          POSTGRES_PASSWORD: tidewatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tidewatch -d tidewatch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app tests alembic

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest

  container-build:
    name: Container builds
    runs-on: ubuntu-latest
    needs: api-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --tag tidewatch-api:ci apps/api

      - name: Build worker image
        run: docker build --tag tidewatch-worker:ci apps/worker
