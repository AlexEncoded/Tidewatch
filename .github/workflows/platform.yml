name: Tidewatch platform validation

on:
  push:
    branches: [main]
    paths:
      - "helm/**"
      - "kubernetes/**"
      - "argocd/**"
  pull_request:
    paths:
      - "helm/**"
      - "kubernetes/**"
      - "argocd/**"

permissions:
  contents: read

jobs:
  helm:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Lint Tidewatch chart
        run: helm lint helm/tidewatch -f helm/tidewatch/values-dev.yaml

      - name: Render Tidewatch chart
        run: helm template tidewatch helm/tidewatch -f helm/tidewatch/values-dev.yaml > /tmp/tidewatch-rendered.yaml

      - name: Render Key Vault CSI variant
        run: >-
          helm template tidewatch helm/tidewatch
          -f helm/tidewatch/values-dev.yaml
          --set keyVault.enabled=true
          --set keyVault.name=tidewatch-validation
          --set keyVault.tenantId=00000000-0000-0000-0000-000000000000
          --set workloadIdentity.enabled=true
          --set workloadIdentity.clientId=00000000-0000-0000-0000-000000000000
          > /tmp/tidewatch-keyvault-rendered.yaml

  kustomize:
    name: Validate Kustomize overlays
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Render dev overlay
        run: kubectl kustomize kubernetes/overlays/dev > /tmp/tidewatch-kustomize.yaml
