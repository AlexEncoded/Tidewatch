rule_files:
  - /work/observability/alerts/tidewatch.rules.yml

evaluation_interval: 1m

tests:
  - interval: 10s
    input_series:
      - series: tidewatch_buoy_last_seen_timestamp_seconds{buoy_id="active"}
        values: "0+10x30"
      - series: tidewatch_buoy_last_seen_timestamp_seconds{buoy_id="stopped"}
        values: "0+0x30"
      - series: tidewatch_device_last_seen_timestamp_seconds{buoy_id="active",device_id="device-a",sensor_channel="A"}
        values: "0+10x30"
      - series: tidewatch_device_last_seen_timestamp_seconds{buoy_id="stopped",device_id="device-b",sensor_channel="B"}
        values: "0+0x30"
    promql_expr_test:
      - expr: tidewatch:buoy_availability_ratio5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="tidewatch:buoy_availability_ratio5m",buoy_id="active"}'
            value: 1
          - labels: '{__name__="tidewatch:buoy_availability_ratio5m",buoy_id="stopped"}'
            value: 0.16666666666666666
      - expr: tidewatch:device_availability_ratio5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="tidewatch:device_availability_ratio5m",buoy_id="active",device_id="device-a",sensor_channel="A"}'
            value: 1
          - labels: '{__name__="tidewatch:device_availability_ratio5m",buoy_id="stopped",device_id="device-b",sensor_channel="B"}'
            value: 0.16666666666666666
  - interval: 10s
    input_series:
      - series: tidewatch_telemetry_ingestion_jobs{status="pending"}
        values: "125+0x30"
      - series: tidewatch_telemetry_ingestion_jobs{status="failed"}
        values: "2+0x30"
      - series: tidewatch_telemetry_ingestion_oldest_pending_seconds
        values: "360+0x30"
      - series: tidewatch_telemetry_ingestion_expired_leases
        values: "1+0x30"
      - series: tidewatch_telemetry_ingestion_retried_jobs
        values: "11+0x30"
      - series: tidewatch_telemetry_ingestion_metrics_collection_success
        values: "1+0x30"
    promql_expr_test:
      - expr: tidewatch_telemetry_ingestion_jobs{status="pending"} > 100
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="tidewatch_telemetry_ingestion_jobs",status="pending"}'
            value: 125
      - expr: tidewatch_telemetry_ingestion_oldest_pending_seconds > 300
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="tidewatch_telemetry_ingestion_oldest_pending_seconds"}'
            value: 360
      - expr: tidewatch_telemetry_ingestion_expired_leases > 0
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="tidewatch_telemetry_ingestion_expired_leases"}'
            value: 1
      - expr: tidewatch_telemetry_ingestion_jobs{status="failed"} > 0
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="tidewatch_telemetry_ingestion_jobs",status="failed"}'
            value: 2
      - expr: tidewatch_telemetry_ingestion_retried_jobs > 10
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="tidewatch_telemetry_ingestion_retried_jobs"}'
            value: 11
