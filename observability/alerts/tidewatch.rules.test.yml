rule_files:
  - /work/observability/alerts/tidewatch.rules.yml

evaluation_interval: 1m

tests:
  - interval: 10s
    input_series:
      - series: tidewatch_buoy_last_seen_timestamp_seconds{buoy_id="active"}
        values: "0+10x360"
      - series: tidewatch_buoy_last_seen_timestamp_seconds{buoy_id="stopped"}
        values: "0+0x360"
      - series: tidewatch_device_last_seen_timestamp_seconds{buoy_id="active",device_id="device-a",sensor_channel="A"}
        values: "0+10x360"
      - series: tidewatch_device_last_seen_timestamp_seconds{buoy_id="stopped",device_id="device-b",sensor_channel="B"}
        values: "0+0x360"
      - series: up{job="tidewatch-api",instance="tidewatch-api:8000"}
        values: "1+0x30"
      - series: up{job="tidewatch-api",instance="unavailable-api:8000"}
        values: "0+0x30"
    promql_expr_test:
      - expr: tidewatch:buoy_availability_ratio5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="tidewatch:buoy_availability_ratio5m",buoy_id="active"}'
            value: 1
          - labels: '{__name__="tidewatch:buoy_availability_ratio5m",buoy_id="stopped"}'
            value: 0.16666666666666666
      - expr: tidewatch:device_availability_ratio5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="tidewatch:device_availability_ratio5m",buoy_id="active",device_id="device-a",sensor_channel="A"}'
            value: 1
          - labels: '{__name__="tidewatch:device_availability_ratio5m",buoy_id="stopped",device_id="device-b",sensor_channel="B"}'
            value: 0.16666666666666666
      - expr: tidewatch:buoy_availability_ratio30d < 0.9999
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="tidewatch:buoy_availability_ratio30d",buoy_id="stopped"}'
            value: 0.16666666666666666
      - expr: tidewatch:device_availability_ratio30d < 0.9999
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="tidewatch:device_availability_ratio30d",buoy_id="stopped",device_id="device-b",sensor_channel="B"}'
            value: 0.16666666666666666
      - expr: abs(tidewatch:buoy_error_budget_remaining_percent - 100) < bool 0.01
        eval_time: 5m
        exp_samples:
          - labels: '{buoy_id="active"}'
            value: 1
          - labels: '{buoy_id="stopped"}'
            value: 0
      - expr: abs(tidewatch:device_error_budget_remaining_percent - 100) < bool 0.01
        eval_time: 5m
        exp_samples:
          - labels: '{buoy_id="active",device_id="device-a",sensor_channel="A"}'
            value: 1
          - labels: '{buoy_id="stopped",device_id="device-b",sensor_channel="B"}'
            value: 0
    alert_rule_test:
      - eval_time: 2m
        alertname: TidewatchApiTargetUnavailable
        exp_alerts:
          - exp_labels:
              instance: unavailable-api:8000
              job: tidewatch-api
              severity: critical
            exp_annotations:
              summary: "Tidewatch API metrics endpoint is unavailable"
              description: "Prometheus cannot scrape the Tidewatch API; request-based availability metrics may be absent."
      - eval_time: 10m
        alertname: TidewatchBuoyAvailabilityBelowTarget
        exp_alerts:
          - exp_labels:
              buoy_id: stopped
              severity: warning
            exp_annotations:
              summary: "Tidewatch buoy availability is below target"
              description: "Observed buoy availability is below 99.99% over the trailing 30 days, or since its first Prometheus sample if newer."
      - eval_time: 10m
        alertname: TidewatchDeviceAvailabilityBelowTarget
        exp_alerts:
          - exp_labels:
              buoy_id: stopped
              device_id: device-b
              sensor_channel: B
              severity: warning
            exp_annotations:
              summary: "Tidewatch physical device availability is below target"
              description: "Observed physical-device availability is below 99.99% over the trailing 30 days, or since its first Prometheus sample if newer."
      - eval_time: 10m
        alertname: TidewatchBuoyAvailabilityFastBurn
        exp_alerts:
          - exp_labels:
              buoy_id: stopped
              severity: warning
            exp_annotations:
              summary: "Tidewatch buoy is rapidly consuming its availability error budget"
              description: "Availability has fallen below 99.85% in both the last five minutes and the last hour; inspect buoy connectivity and device health."
      - eval_time: 10m
        alertname: TidewatchDeviceAvailabilityFastBurn
        exp_alerts:
          - exp_labels:
              buoy_id: stopped
              device_id: device-b
              sensor_channel: B
              severity: warning
            exp_annotations:
              summary: "Tidewatch physical device is rapidly consuming its availability error budget"
              description: "Device availability has fallen below 99.85% in both the last five minutes and the last hour; inspect the affected device and its buoy redundancy."
      - eval_time: 10m
        alertname: TidewatchDeviceClockSkew
        exp_alerts:
          - exp_labels:
              buoy_id: clock-skew
              device_id: device-c
              sensor_channel: A
              severity: warning
            exp_annotations:
              summary: "Tidewatch device timestamp differs from API time"
              description: "The latest device measurement timestamp differs from its API receipt time by more than two minutes; inspect clock synchronization and telemetry delivery delay."
  - interval: 10s
    input_series:
      - series: tidewatch_device_clock_offset_seconds{buoy_id="clock-skew",device_id="device-c",sensor_channel="A"}
        values: "121+0x90"
      - series: tidewatch_telemetry_ingestion_jobs{status="pending"}
        values: "125+0x30"
      - series: tidewatch_telemetry_ingestion_jobs{status="failed"}
        values: "2+0x30"
      - series: tidewatch_telemetry_ingestion_oldest_pending_seconds
        values: "360+0x30"
      - series: tidewatch_telemetry_ingestion_expired_leases
        values: "1+0x30"
      - series: tidewatch_telemetry_ingestion_retried_jobs
        values: "11+0x30"
      - series: tidewatch_telemetry_ingestion_metrics_collection_success
        values: "1+0x30"
    promql_expr_test:
      - expr: tidewatch_telemetry_ingestion_jobs{status="pending"} > 100
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="tidewatch_telemetry_ingestion_jobs",status="pending"}'
            value: 125
      - expr: tidewatch_telemetry_ingestion_oldest_pending_seconds > 300
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="tidewatch_telemetry_ingestion_oldest_pending_seconds"}'
            value: 360
      - expr: tidewatch_telemetry_ingestion_expired_leases > 0
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="tidewatch_telemetry_ingestion_expired_leases"}'
            value: 1
      - expr: tidewatch_telemetry_ingestion_jobs{status="failed"} > 0
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="tidewatch_telemetry_ingestion_jobs",status="failed"}'
            value: 2
      - expr: tidewatch_telemetry_ingestion_retried_jobs > 10
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="tidewatch_telemetry_ingestion_retried_jobs"}'
            value: 11
  - interval: 10s
    input_series:
      - series: tidewatch_wave_period_sensor_disagreement{buoy_id="wave-conflict"}
        values: "1+0x210"
      - series: tidewatch_wave_analysis_last_run_timestamp_seconds{buoy_id="wave-conflict"}
        values: "0+0x210"
    promql_expr_test:
      - expr: (tidewatch_wave_period_sensor_disagreement == 1) and (time() - tidewatch_wave_analysis_last_run_timestamp_seconds < 1800)
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="tidewatch_wave_period_sensor_disagreement",buoy_id="wave-conflict"}'
            value: 1
      - expr: (tidewatch_wave_period_sensor_disagreement == 1) and (time() - tidewatch_wave_analysis_last_run_timestamp_seconds < 1800)
        eval_time: 35m
        exp_samples: []
