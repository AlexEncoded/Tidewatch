groups:
  - name: tidewatch-buoys
    rules:
      - record: tidewatch:api_availability_ratio5m
        expr: |
          1 - (
            sum(rate(tidewatch_http_requests_total{status_code=~"5.."}[5m]))
              /
            clamp_min(sum(rate(tidewatch_http_requests_total[5m])), 1e-9)
          )
      - alert: TidewatchApiServerErrors
        expr: |
          tidewatch:api_availability_ratio5m < 0.99
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch API is returning server errors"
          description: "More than one percent of API requests have returned 5xx responses during the last five minutes."
      - alert: TidewatchApiTargetUnavailable
        expr: up{job="tidewatch-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Tidewatch API metrics endpoint is unavailable"
          description: "Prometheus cannot scrape the Tidewatch API; request-based availability metrics may be absent."
      - alert: TidewatchTelemetryQueueBacklog
        expr: tidewatch_telemetry_ingestion_jobs{status="pending"} > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch telemetry queue is backing up"
          description: "More than 100 telemetry jobs have remained pending; check worker health and database capacity."
      - alert: TidewatchTelemetryQueueOldestJob
        expr: tidewatch_telemetry_ingestion_oldest_pending_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch telemetry jobs are delayed"
          description: "The oldest pending telemetry job is more than five minutes old."
      - alert: TidewatchTelemetryQueueExpiredLease
        expr: tidewatch_telemetry_ingestion_expired_leases > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch telemetry worker lease expired"
          description: "At least one processing job has an expired worker lease and awaits recovery."
      - alert: TidewatchTelemetryQueueRetryingJobs
        expr: tidewatch_telemetry_ingestion_retried_jobs > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch telemetry jobs are repeatedly retrying"
          description: "More than ten queued jobs have been retried; inspect worker errors and database health."
      - alert: TidewatchTelemetryQueueTerminalFailures
        expr: tidewatch_telemetry_ingestion_jobs{status="failed"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch telemetry jobs have failed permanently"
          description: "One or more telemetry jobs exhausted their retry budget and require inspection."
      - alert: TidewatchTelemetryQueueMetricsUnavailable
        expr: tidewatch_telemetry_ingestion_metrics_collection_success == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch queue metrics could not be refreshed"
          description: "The API could not query PostgreSQL for telemetry queue metrics."
      - record: tidewatch:buoy_availability_ratio5m
        expr: |
          avg_over_time(
            (time() - tidewatch_buoy_last_seen_timestamp_seconds < bool 30)[5m:]
          )
      - record: tidewatch:buoy_availability_ratio30d
        expr: |
          avg_over_time(
            (time() - tidewatch_buoy_last_seen_timestamp_seconds < bool 30)[30d:1m]
          )
      - alert: TidewatchBuoyAvailabilityBelowTarget
        expr: tidewatch:buoy_availability_ratio30d < 0.9999
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch buoy availability is below target"
          description: "Observed buoy availability is below 99.99% over the trailing 30 days, or since its first Prometheus sample if newer."
      - record: tidewatch:device_availability_ratio5m
        expr: |
          avg_over_time(
            (time() - tidewatch_device_last_seen_timestamp_seconds < bool 30)[5m:]
          )
      - record: tidewatch:device_availability_ratio30d
        expr: |
          avg_over_time(
            (time() - tidewatch_device_last_seen_timestamp_seconds < bool 30)[30d:1m]
          )
      - alert: TidewatchDeviceAvailabilityBelowTarget
        expr: tidewatch:device_availability_ratio30d < 0.9999
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch physical device availability is below target"
          description: "Observed physical-device availability is below 99.99% over the trailing 30 days, or since its first Prometheus sample if newer."
      - alert: TidewatchBuoySilent
        expr: time() - tidewatch_buoy_last_seen_timestamp_seconds > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch buoy is not sending readings"
          description: "The buoy has not reported a temperature reading for more than 30 minutes."
      - alert: TidewatchSensorDegraded
        expr: tidewatch_sensor_degraded == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch redundant sensor is degraded"
          description: "One sensor family is reporting a significant difference between channels A and B."
      - alert: TidewatchSensorChannelMissing
        expr: tidewatch_sensor_channel_missing == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch sensor channel is missing"
          description: "A redundant sensor channel has stopped reporting while its paired channel remains available."
      - alert: TidewatchSensorDecisionInvalid
        expr: tidewatch_sensor_health_decision{decision="invalid"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tidewatch sensor decision is invalid"
          description: "A sensor family has no trustworthy value after redundant-channel validation and requires maintenance review."
      - alert: TidewatchSensorFallbackActive
        expr: tidewatch_sensor_health_decision{decision=~"fallback_a|fallback_b"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch sensor fallback is active"
          description: "A sensor family is operating with only one valid redundant channel and should be inspected before redundancy is lost."
      - alert: TidewatchInvalidReadings
        expr: sum by (buoy_id) (increase(tidewatch_reading_quality_total{quality="invalid"}[10m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch buoy is producing invalid readings"
          description: "The buoy has produced at least one invalid sensor reading during the last ten minutes."
      - alert: TidewatchLowBattery
        expr: tidewatch_battery_percent < 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch buoy battery is low"
          description: "The buoy battery is below 20 percent and requires maintenance planning."
      - alert: TidewatchRedundantBatteryDegraded
        expr: tidewatch_battery_delta_percent > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch redundant batteries are diverging"
          description: "The battery levels of the two physical buoy devices differ by more than 10 percentage points."
      - alert: TidewatchRedundantDeviceMissing
        expr: tidewatch_redundant_device_missing == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tidewatch redundant buoy device is missing"
          description: "One physical buoy device has stopped sending battery telemetry and requires inspection."
      - alert: TidewatchBuoyDrifting
        expr: tidewatch_buoy_movement_speed_mps > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch buoy movement is above the safe threshold"
          description: "The experimental movement estimate is above 1 m/s and should be reviewed by maintenance."
      - alert: TidewatchExperimentalWaveHigh
        expr: tidewatch_current_estimated_wave_height_m > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch experimental wave estimate is high"
          description: "The GNSS/IMU wave estimate is above 2 m; validate calibration and local conditions before taking action."
      - alert: TidewatchWavePeriodSensorDisagreement
        expr: |
          tidewatch_wave_period_sensor_disagreement == 1
            and (time() - tidewatch_wave_analysis_last_run_timestamp_seconds < 1800)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch GNSS and IMU wave periods repeatedly disagree"
          description: "Three or more recent period analyses disagreed; inspect sample timing and sensor calibration before relying on wave-period estimates."
