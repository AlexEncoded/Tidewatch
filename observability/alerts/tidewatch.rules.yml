groups:
  - name: tidewatch-buoys
    rules:
      - alert: TidewatchBuoySilent
        expr: time() - tidewatch_buoy_last_seen_timestamp_seconds > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch buoy is not sending readings"
          description: "The buoy has not reported a temperature reading for more than 30 minutes."
      - alert: TidewatchSensorDegraded
        expr: tidewatch_sensor_degraded == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch redundant sensor is degraded"
          description: "One sensor family is reporting a significant difference between channels A and B."
      - alert: TidewatchSensorChannelMissing
        expr: tidewatch_sensor_channel_missing == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch sensor channel is missing"
          description: "A redundant sensor channel has stopped reporting while its paired channel remains available."
      - alert: TidewatchSensorDecisionInvalid
        expr: tidewatch_sensor_health_decision{decision="invalid"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tidewatch sensor decision is invalid"
          description: "A sensor family has no trustworthy value after redundant-channel validation and requires maintenance review."
      - alert: TidewatchSensorFallbackActive
        expr: tidewatch_sensor_health_decision{decision=~"fallback_a|fallback_b"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch sensor fallback is active"
          description: "A sensor family is operating with only one valid redundant channel and should be inspected before redundancy is lost."
      - alert: TidewatchInvalidReadings
        expr: sum by (buoy_id) (increase(tidewatch_reading_quality_total{quality="invalid"}[10m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch buoy is producing invalid readings"
          description: "The buoy has produced at least one invalid sensor reading during the last ten minutes."
      - alert: TidewatchLowBattery
        expr: tidewatch_battery_percent < 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch buoy battery is low"
          description: "The buoy battery is below 20 percent and requires maintenance planning."
      - alert: TidewatchRedundantBatteryDegraded
        expr: tidewatch_battery_delta_percent > 10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch redundant batteries are diverging"
          description: "The battery levels of the two physical buoy devices differ by more than 10 percentage points."
      - alert: TidewatchRedundantDeviceMissing
        expr: tidewatch_redundant_device_missing == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tidewatch redundant buoy device is missing"
          description: "One physical buoy device has stopped sending battery telemetry and requires inspection."
      - alert: TidewatchBuoyDrifting
        expr: tidewatch_buoy_movement_speed_mps > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Tidewatch buoy movement is above the safe threshold"
          description: "The experimental movement estimate is above 1 m/s and should be reviewed by maintenance."
