apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tidewatch-dev
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: tidewatch
    tidewatch.io/environment: dev
spec:
  project: default
  source:
    repoURL: https://github.com/AlexEncoded/Tidewatch.git
    targetRevision: main
    path: helm/tidewatch
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: tidewatch-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
