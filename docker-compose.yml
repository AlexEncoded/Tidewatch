services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tidewatch
      POSTGRES_USER: tidewatch
      POSTGRES_PASSWORD: tidewatch
    ports:
      - "5432:5432"
    volumes:
      - tidewatch-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tidewatch -d tidewatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://tidewatch:tidewatch@postgres:5432/tidewatch
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  buoy-simulator:
    build:
      context: ./apps/worker
    environment:
      API_URL: http://api:8000
      INTERVAL_SECONDS: 10
      BUOY_NAME: Mediterranean Sentinel
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  tidewatch-postgres:
