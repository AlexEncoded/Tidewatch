services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tidewatch
      POSTGRES_USER: tidewatch
      POSTGRES_PASSWORD: tidewatch
    ports:
      - "5432:5432"
    volumes:
      - tidewatch-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tidewatch -d tidewatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://tidewatch:tidewatch@postgres:5432/tidewatch
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  tidewatch-postgres:
